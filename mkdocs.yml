site_name: Kanetik Billing Library
site_description: A coroutine-first wrapper around Google Play Billing Library 8.x.
site_url: https://kanetik.github.io/billing-library/
repo_url: https://github.com/kanetik/billing-library
repo_name: kanetik/billing-library
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

# Keep operational / internal docs out of the published site. Anything
# under docs/_internal/ (manual setup, IFTTT config, the automated update
# playbook) is contributor-facing and shouldn't appear in nav, search, or
# the rendered HTML. exclude_docs uses gitignore-style patterns and is
# applied before the build, so the files aren't even copied into the
# generated site/.
exclude_docs: |
  _internal/

validation:
  # docs/api/ is populated at CI time from Dokka HTML output (see
  # .github/workflows/docs.yml). Locally it's gitignored and empty, so
  # don't error on the api/index.html nav entry until mkdocs build runs
  # in the workflow.
  nav:
    not_found: ignore

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quick-start.md
  - Guides:
      - Purchase recovery: guides/purchase-recovery.md
      - Error handling: guides/error-handling.md
      - EntitlementCache: guides/entitlement-cache.md
      - Signature verification: guides/signature-verification.md
      - Server-driven revocation: guides/server-driven-revocation.md
      - Lifecycle integration: guides/lifecycle.md
      - Logging: guides/logging.md
      - Dependency injection: guides/dependency-injection.md
      - Multi-quantity purchases: guides/multi-quantity.md
      - Multi-offer products: guides/multi-offer-products.md
      - Product-details caching: guides/product-details-caching.md
      - In-app messaging: guides/in-app-messaging.md
      - Subscriptions (v0.1.x): guides/subscriptions.md
  - Reference:
      - API overview: reference/api-overview.md
      - Replay semantics: reference/replay-semantics.md
      - Extensions: reference/extensions.md
      - Limitations: reference/limitations.md
  - Testing: testing.md
  - Roadmap: roadmap.md
  - Design notes: design-notes.md
  - API (Dokka): api/index.html
