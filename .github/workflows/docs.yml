name: Publish docs site

# Builds the MkDocs Material site (with Dokka HTML mounted at /api/) and
# on push-to-main pushes the result to the gh-pages branch. GitHub Pages
# serves that branch at https://kanetik.github.io/billing-library/.
#
# Two trigger modes:
#   - push to main:  full build + `mkdocs gh-deploy --force` (publishes)
#   - pull_request:  full build with `mkdocs build --strict` only — no
#                    deploy. Catches Dokka failures, broken nav links,
#                    and missing pages before the PR merges to main.
#   - workflow_dispatch: manual run, also publishes (useful after a
#                        Pages settings change).
#
# One-time setup after the first successful run of this workflow:
#   Repo Settings -> Pages -> Source: "Deploy from a branch" -> Branch: gh-pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'billing/src/main/kotlin/**'
      - 'billing/build.gradle.kts'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'billing/src/main/kotlin/**'
      - 'billing/build.gradle.kts'
  workflow_dispatch:

# Single in-flight build per branch / PR. If a second commit lands on
# main while the first is still deploying, the first run is cancelled
# so gh-pages can't be overwritten with stale output by an older run
# finishing last.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (for Gradle / Dokka)
        # Gradle 9.x requires JDK 17+ to run; Dokka 2.x runs in the same
        # daemon. The produced AAR still targets JDK 11 via jvmToolchain(11).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Dokka HTML
        # `dokkaGeneratePublicationHtml` is the same task vanniktech's
        # JavadocJar.Dokka(...) calls during Maven Central publish, so the
        # output here matches what consumers see in the Maven Javadoc JAR.
        run: ./gradlew :billing:dokkaGeneratePublicationHtml --no-configuration-cache

      - name: Mount Dokka output under docs/api/
        run: |
          rm -rf docs/api
          mkdir -p docs/api
          # Dokka 2.x writes to billing/build/dokka/html. Copy the contents
          # (not the directory itself) so docs/api/index.html is the entry
          # point referenced from mkdocs.yml's nav.
          cp -r billing/build/dokka/html/. docs/api/
          test -f docs/api/index.html || (echo "Dokka output missing index.html" && ls -la billing/build/dokka/html/ && exit 1)

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build site (strict — fails on warnings)
        # Always run on every trigger. Strict mode catches broken nav
        # links, missing referenced pages, and other footguns before
        # they reach gh-pages. On pull_request this is the only build
        # step that runs (no deploy); on push to main / dispatch the
        # gh-deploy step runs after.
        run: mkdocs build --strict

      - name: Configure git for gh-deploy
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
